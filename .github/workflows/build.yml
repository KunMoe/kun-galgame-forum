# Build kungal images and push to GHCR, then trigger a Dokploy redeploy.
# See docs/deploy/13-registry-ci.md.
#
# kungal-web is a SINGLE Nuxt app (no APP arg) and is built GENERIC: its
# browser-facing public config is read at RUNTIME from docker/web.env's
# NUXT_PUBLIC_* names, so one image works in any environment — set the real
# https domains in Dokploy / web.env, not here.
name: build-and-push

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kungal-api
            file: docker/go.Dockerfile
            args: CMD=server
          - name: kungal-migrate
            file: docker/go.Dockerfile
            args: CMD=migrate
          - name: kungal-tools         # every cmd/* binary, for one-off data-cutover jobs
            file: docker/tools.Dockerfile
            args: ""
          - name: kungal-web
            file: docker/nuxt.Dockerfile
            args: ""
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          push: true
          tags: |
            ghcr.io/kunmoe/${{ matrix.name }}:latest
            ghcr.io/kunmoe/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy redeploy
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_KUNGAL }}
          TITLE: ${{ github.event.head_commit.message || github.sha }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DOKPLOY_WEBHOOK_KUNGAL not set — images pushed to GHCR, skipping redeploy trigger."
            exit 0
          fi
          # The compose is sourceType=github, so Dokploy branch-matches the
          # request as a GitHub push event. The bodyless POST this step sent
          # until 2026-09-23 got {"message":"Branch Not Match"} on every run,
          # which `curl -f` counted as success: no merge was ever deployed by
          # CI, and the host's compose checkout froze at the last panel deploy.
          # Masquerade as a push (as nextmoe-infra does) and require a 200.
          body=$(jq -n --arg ref "$GITHUB_REF" --arg sha "$GITHUB_SHA" --arg title "$TITLE" \
            '{ref: $ref, head_commit: {id: $sha, message: $title}}')
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST "$WEBHOOK" \
            -H 'content-type: application/json' -H 'x-github-event: push' \
            --data-raw "$body")
          cat response.json; echo
          [ "$code" = "200" ]
