# kungal (kun-galgame-forum) — PRODUCTION compose (Dokploy + GHCR images).
#
# Downstream app: owns NO backing services. Joins the shared `dokploy-network`
# and reaches infra by service name (postgres:5432, redis:6379, oauth:9277,
# catalog:9281, image:9278). Bring infra up first.
#
# vs docker-compose.yml (dev): `image:` not `build:`, `expose:` not `ports:`,
# and **NO `env_file`** — all config is inline `environment:` so Dokploy needs no
# `docker/*.env` on disk. Non-secret/domains are literal; secrets come from the
# kungal app's **Dokploy Environment** via ${VAR}.
#
# Set in kungal's Dokploy Environment:
#   POSTGRES_PASSWORD  OAUTH_CLIENT_SECRET  JWT_SECRET
#   (optional) KUN_IMAGE_CLIENT_ID/SECRET  FILE_STORAGE_* (B2 工具集)  MAIL_*
# These MUST match infra's: POSTGRES_PASSWORD = infra POSTGRES_PASSWORD;
# OAUTH_CLIENT_SECRET = 注册论坛 client 的明文.
# (JWT_SECRET here is kungal's OWN session secret — need NOT match infra.)
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d      # migrate auto-runs (gated) before kungal-api
# The migrate service is no longer in the `jobs` profile: a plain `up` runs it
# first (kungal-api depends_on it: service_completed_successfully) so pending
# migrations auto-apply and the API never serves an un-migrated schema. Deferred
# / cross-repo-ordered migrations are still held back by the migrate binary's
# default `-exclude` list (005/006/007/012/015 today); to add a FUTURE cross-repo
# migration, append its prefix to that default in cmd/migrate/main.go, then run
# it manually with `--only=NNN` at the right moment (nextmoe-docs docs/shared/user-migration + 16-data-cutover.md).
name: kungal

x-svc-health: &svc-health
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 15s

# ── api / migrate / tools runtime env (literal = non-secret; ${VAR} = panel) ──
x-kungal-api-env: &kungal-api-env
  SERVER_PORT: "2334"
  SERVER_MODE: prod
  CORS_ALLOW_ORIGINS: https://www.kungal.com,https://kungal.com
  # ⚠ POSTGRES_PASSWORD 直接拼进 DSN → 必须 URL-safe(字母数字;勿含 @ : / # % ? &,否则 URL 解析坏)
  KUN_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Dokploy}@postgres:5432/kungalgame
  DB_MAX_OPEN_CONNS: "25"
  DB_MAX_IDLE_CONNS: "10"
  DB_CONN_MAX_LIFETIME: "300"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_DB: "0"
  OAUTH_SERVER_URL: http://oauth:9277/api/v1
  OAUTH_CLIENT_ID: 4ed9bc99ec0a789a4796b83e22bd84c5
  OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:?set OAUTH_CLIENT_SECRET in Dokploy (论坛 client 注册时的明文)}
  OAUTH_REDIRECT_URI: https://www.kungal.com/auth/callback
  # ── App direct access (refs/docs/proj/app-direct-api.md) ──
  # A first-party client's user access token (ES256 JWT) may call /api/* as
  # `Authorization: Bearer`. ISSUER must be the OP's PUBLIC origin — that is what
  # it stamps into `iss`; deriving it from OAUTH_SERVER_URL above would give
  # http://oauth:9277 and 401 every App request. JWKS is fetched in-network.
  # CLIENT_IDS is the allow-list (comma separated); empty closes the channel.
  # Both are public clients infra registered 2026-09-17 (site_id=2,
  # catalog_site=kungal, no owner): kungal-app = Android/iOS, kungal-app-desktop
  # = Windows/Linux loopback. A client missing here 401s every one of its users.
  KUN_OIDC_ISSUER: https://account.nextmoe.com
  KUN_OIDC_JWKS_URL: http://oauth:9277/oauth/jwks
  KUN_BEARER_CLIENT_IDS: kungal-app,kungal-app-desktop
  # ── comment areas on the community primitive (track 03) ──
  # Community is now the UNCONDITIONAL backend for the galgame + resource
  # (rating / website / toolset) comment areas: the legacy in-forum comment
  # routes were retired (charter step 06a), so the per-area *_COMMENTS_COMMUNITY
  # flags and the *_COMMENT_READONLY freeze switches are gone. Client creds fall
  # back to OAUTH_CLIENT_ID/SECRET above (app.go); unconfigured = comments
  # degrade (reads empty / writes 503). The frozen galgame_comment* / resource
  # comment tables still back profile / admin / search reads and await a later
  # deploy-then-drop migration.
  KUN_COMMUNITY_API_BASE: http://community:9282/api/v1/community
  # ── DLsite 联盟补票链接 (合作公告 topic/3867) ──
  # {workno} 由 catalog 的 refs.dlsite 原样替换。整段模板走 env 而非拼装:
  # DLsite 的联盟路径可能按站点段不同 (/soft/ 是 pro/VJ 路径), 换路径只改这里。
  # 空模板 = 功能关闭, 补票提示回落成原来的纯文案。
  KUN_DLSITE_LINK_TEMPLATE: ${KUN_DLSITE_LINK_TEMPLATE:-https://dlaf.jp/soft/dlaf/=/t/s/link/work/aid/kungal/locale/zh_CN/id/{workno}.html/?locale=zh_CN}
  # 优惠券落地页。必须是短链 (合作方要求, 防网络审查拦截)。这条是常设落地页,
  # 不是 campaign; store 面报告有活动时会被 coupon_url 顶掉, 没有活动时仍然展示。
  KUN_DLSITE_COUPON_URL: ${KUN_DLSITE_COUPON_URL:-https://umami.kungal.org/q/N3TmTZJ9X}
  # infra 的 /v2/store 面。给出 key 后购买按钮改用它铸的本站专属短链 —— 短链背后
  # 的点击计数就是结算依据, 直链虽然照样能买但这笔销售 infra 看不见。
  # 第三把 developer key (scope 只要 store:read), 不与 catalog/news 共用: v2 限流
  # 按 key 分桶, 铸链不能吃掉目录读的每分钟预算; 而短链归属按 OAuth client 算,
  # 所以另开一把 key 不会拆散归因。空 = 只用上面的联盟直链模板, 站点行为不变。
  # KUN_STORE_API_BASE 默认取 KUN_NEXTMOE_API_BASE (同一个 catalog 进程)。
  KUN_STORE_API_KEY: ${KUN_STORE_API_KEY:-}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in Dokploy (kungal 自己的会话密钥)}
  # toolset archive uploads (Backblaze B2). 空则上传路由仍注册、调用 500(应用只 warn 不拦);要开 toolset 上传就填全 5 个
  # (内嵌/内容图不走这里 — 全部经 image_service,详见 KUN_IMAGE_CLIENT_*)
  FILE_STORAGE_ENDPOINT: ${FILE_STORAGE_ENDPOINT:-}
  FILE_STORAGE_REGION: ${FILE_STORAGE_REGION:-}
  FILE_STORAGE_BUCKET: ${FILE_STORAGE_BUCKET:-}
  FILE_STORAGE_ACCESS_KEY: ${FILE_STORAGE_ACCESS_KEY:-}
  FILE_STORAGE_SECRET_KEY: ${FILE_STORAGE_SECRET_KEY:-}
  # mail (blank → disabled)
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USER: ${MAIL_USER:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-}
  # NextMoe catalog galgame read surface (host base with no path suffix): the
  # client calls {base}/v2/catalog/* with Authorization: Bearer nmk_… . The /v1
  # family is being retired upstream, so no suffix belongs on this value.
  KUN_NEXTMOE_API_BASE: http://catalog:9281
  # Developer API key for the read face (nmk_ Bearer). REQUIRED whenever a base
  # is set: an empty key fails fast at config load. Set in Dokploy; plaintext in
  # kungal-neo /root/phase2-internal-keys.env (kungal-forum-internal-s2s).
  # The same key also reads the moyu patch face through the public gateway
  # (KUN_MOYU_API_BASE, default https://api.nextmoe.dev): catalog:9281 does not
  # serve /v2/moyu, and the face takes any valid key.
  KUN_NEXTMOE_API_KEY: ${KUN_NEXTMOE_API_KEY:-}
  # NextMoe news face (/v2/news) — the home page's Gal 情报 tab. A SECOND key,
  # NOT the catalog one above: the face is gated on scope news:read, which the
  # catalog key does not carry, so a leak of this one cannot reach the
  # catalogue's write endpoints. Empty → /news answers 503 情报服务未配置 and
  # only that tab is affected.
  # ⚠ This line is what makes the Dokploy panel var reach the container. The tab
  # shipped without it and answered 503 in prod even with KUN_NEWS_API_KEY set in
  # the panel — the same moyu/image lesson as LINK_CHECKER_* and KUN_TRUST_* above.
  # KUN_NEWS_API_BASE is deliberately unset: it defaults to KUN_NEXTMOE_API_BASE,
  # and /v2/news is served by the same catalog process.
  KUN_NEWS_API_KEY: ${KUN_NEWS_API_KEY:-}
  # catalog read proxy (step 36): credits / entity reverse-lookups. Reuses the
  # OAuth client pair for S2S Basic auth; unset → those routes degrade to 503.
  KUN_CATALOG_API_BASE: http://catalog:9281
  # image_service (shared CDN domain == infra KUN_IMAGE_PUBLIC_BASE_URL)
  KUN_IMAGE_PUBLIC_BASE_URL: https://image.kungal.iloveren.link
  KUN_IMAGE_CLIENT_BASE_URL: http://image:9278
  # kungal's image_service client IS its own OAuth client (same id/secret as the
  # login client above): image_service authenticates uploads via HTTP Basic
  # (client_id:client_secret), then checks image_enabled + image_site_key +
  # image_allowed_presets on the infra oauth_clients row (set to enabled /
  # site_key=kungal / [topic, galgame_banner]). So reuse the OAuth creds rather
  # than a separate Dokploy var.
  KUN_IMAGE_CLIENT_ID: 4ed9bc99ec0a789a4796b83e22bd84c5
  KUN_IMAGE_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:?set OAUTH_CLIENT_SECRET in Dokploy}
  # artifact service (toolset archive upload/download). Same pattern as the image
  # client: kungal's artifact "site" IS its OAuth client, so the artifact client
  # creds fall back to OAUTH_CLIENT_ID/SECRET (no separate Dokploy var). Only the
  # base URL is needed — and it MUST be wired here in the anchor (a Dokploy panel
  # var alone never reaches the container, the moyu lesson). At prod cutover the
  # infra oauth_clients row must also have artifact_enabled + site_key=kungal.
  KUN_ARTIFACT_CLIENT_BASE_URL: http://artifact:9279
  # kungal-link-live-checker — the "report resource expired" gate (dead→失效 /
  # alive→驳回误报 / unknown→旧流程). Set all 4 in Dokploy to enable it; the
  # checker is behind Cloudflare Access so the CF service-token headers are
  # required alongside the Bearer key. Any unset → gate OFF (legacy flow). These
  # MUST be wired here — a Dokploy panel var only reaches the container when the
  # compose env references it, which is exactly why the gate stayed off before.
  LINK_CHECKER_BASE_URL: ${LINK_CHECKER_BASE_URL:-}
  LINK_CHECKER_API_KEY: ${LINK_CHECKER_API_KEY:-}
  CF_ACCESS_CLIENT_ID: ${CF_ACCESS_CLIENT_ID:-}
  CF_ACCESS_CLIENT_SECRET: ${CF_ACCESS_CLIENT_SECRET:-}
  # Trust & Safety (doc 18): report intake (kungal → trust) + enforcement
  # callback verification (trust → kungal). BASE_URL/SITE are non-secret
  # structural values → literal, like the sibling service URLs above (a Dokploy
  # panel var alone never reaches the container — the moyu/image lesson). The Go
  # defaults (127.0.0.1:9283 / kungal) are WRONG in-container for BASE_URL, so
  # pin the dokploy-network name (infra exposes the trust service as `trust`).
  # ⚠ With BASE_URL set, report intake goes LIVE the moment kungal deploys — so
  # infra's trust service + kungal's 6 subject_kind rows + the subject_url column
  # must be up FIRST, else reports 403 (catalog_site unbound) / 422 (kind
  # unregistered or pre-subject_url schema). CALLBACK_SECRET (panel) gates ONLY
  # the inbound enforcement callback: empty → callbacks fail-closed 401 while
  # reports still flow, so enforcement stays off until you set it to the SAME
  # secret registered on kungal's subject_kind rows in the trust registry.
  KUN_TRUST_BASE_URL: http://trust:9283
  KUN_TRUST_SITE: kungal
  KUN_TRUST_CALLBACK_SECRET: ${KUN_TRUST_CALLBACK_SECRET:-}
  # Two INDEPENDENT wave-1 moderation switches for topic/reply create+edit, both
  # default off (never keyed off client presence). CHECK = synchronous pre-write
  # word-list gate (deny blocks / hold publishes+logs / fail-open ≤500ms); SCAN =
  # async post-commit shadow scan (best-effort). Flip to true only AFTER infra
  # mints kungal's S2S client + registers the forum_topic/forum_reply kinds.
  KUN_TRUST_CHECK_ENABLED: ${KUN_TRUST_CHECK_ENABLED:-false}
  KUN_TRUST_SCAN_ENABLED: ${KUN_TRUST_SCAN_ENABLED:-false}
  # Seals lottery redemption codes at rest (AES-256-GCM, `openssl rand -hex 32`).
  # Unset → the lottery refuses code prizes rather than storing codes in clear.
  # ROTATING IT makes every sealed code unreadable forever — winners get a 500
  # on reveal. Set once in Dokploy and leave it. Like every panel var above, it
  # only reaches the container because this line names it: it sat set in the
  # panel for a day on 2026-09-23 while the API kept logging "未设置".
  KUN_LOTTERY_CODE_KEY: ${KUN_LOTTERY_CODE_KEY:-}
  # ── App version gate: GET /api/app/version ──
  # The App force-updates every install below MIN_VERSION, so this pair is the
  # kill switch for the direct-download channel. Versions are MAJOR.MINOR.PATCH;
  # a malformed value or MIN above LATEST fails the boot rather than stranding
  # users on a build that does not exist. An unset download falls back to the
  # https://www.kungal.com/app page, which then shows that platform as 即将推出.
  # Changing any of these needs a kungal-api restart.
  KUN_APP_MIN_VERSION: ${KUN_APP_MIN_VERSION:-0.1.0}
  KUN_APP_LATEST_VERSION: ${KUN_APP_LATEST_VERSION:-0.1.0}
  KUN_APP_RELEASE_NOTES: ${KUN_APP_RELEASE_NOTES:-}
  KUN_APP_DOWNLOAD_ANDROID: ${KUN_APP_DOWNLOAD_ANDROID:-}
  KUN_APP_DOWNLOAD_IOS: ${KUN_APP_DOWNLOAD_IOS:-}
  KUN_APP_DOWNLOAD_WINDOWS: ${KUN_APP_DOWNLOAD_WINDOWS:-}
  KUN_APP_DOWNLOAD_LINUX: ${KUN_APP_DOWNLOAD_LINUX:-}
  # The .apk of KUN_APP_LATEST_VERSION for the App's in-place update: all three
  # or none. Bump them together with KUN_APP_LATEST_VERSION, or the App refuses
  # the file as the wrong version and shows the user an error.
  KUN_APP_ANDROID_PACKAGE_URL: ${KUN_APP_ANDROID_PACKAGE_URL:-}
  KUN_APP_ANDROID_PACKAGE_SIZE: ${KUN_APP_ANDROID_PACKAGE_SIZE:-}
  KUN_APP_ANDROID_PACKAGE_SHA256: ${KUN_APP_ANDROID_PACKAGE_SHA256:-}

services:
  # ───────────────────────────── Go API (distroless) ─────────────────────────
  # 服务名直接叫 kungal-api(不是 `api` + alias):Dokploy 不应用 compose 的 networks.aliases,
  # 只把「服务名」注册到 dokploy-network。两仓都叫 `api` 会在共享网络上 DNS 冲突,所以用唯一服务名,
  # SSR(kungal-web → http://kungal-api:2334)才能解析到。
  kungal-api:
    image: ghcr.io/kunmoe/kungal-api:latest
    pull_policy: always
    environment: { <<: *kungal-api-env }
    expose: ["2334"]
    # Wait for `migrate` to finish so the API never serves an un-migrated schema
    # (a failed migration blocks startup by design). postgres/redis live in the
    # infra app (no depends_on for them) — restart reconnects.
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      <<: *svc-health
    restart: unless-stopped

  # ───────────────────────────── Nuxt 4 SSR frontend ─────────────────────────
  # Public config is read at RUNTIME (kungal-web is NOT baked at CI) — set below.
  web:
    image: ghcr.io/kunmoe/kungal-web:latest
    pull_policy: always
    environment:
      # SSR renders absolute times in this zone (the container is otherwise UTC);
      # <KunTime> re-renders in the viewer's own timezone after mount. Asia/Shanghai
      # matches the CN-majority audience so most users see no post-hydration shift.
      TZ: Asia/Shanghai
      NODE_ENV: production
      NUXT_API_BASE_URL: http://kungal-api:2334 # SSR → 本仓 api 服务名 kungal-api(唯一,避免与 moyu api 冲突)
      NUXT_PUBLIC_API_BASE_URL: https://www.kungal.com # browser
      NUXT_PUBLIC_OAUTH_SERVER_URL: https://account.nextmoe.com/api/v1
      NUXT_PUBLIC_OAUTH_FRONTEND_URL: https://account.nextmoe.com
      # 身份管理台自 2026-09 改名起是独立域上的独立应用(account 域只有登录/注册/
      # 个人资料),所以它不能再从 FRONTEND_URL 拼出来。
      NUXT_PUBLIC_OAUTH_ADMIN_URL: https://admin.nextmoe.dev
      NUXT_PUBLIC_OAUTH_CLIENT_ID: 4ed9bc99ec0a789a4796b83e22bd84c5
      NUXT_PUBLIC_OAUTH_REDIRECT_URI: https://www.kungal.com/auth/callback
      NUXT_PUBLIC_KUN_GALGAME_URL: https://www.kungal.com
      # Social cards from nextmoe-og. NUXT_OG_SITE_KEY is the forum's own HMAC key; without it
      # the /og/* routes serve the static kungalgame.webp and the flag below must stay false,
      # or every page advertises a 1200x630 og:image that cannot be produced.
      NUXT_OG_BASE_URL: https://og.nextmoe.dev
      NUXT_OG_SITE_KEY: ${NUXT_OG_SITE_KEY:-}
      NUXT_PUBLIC_OG_CARD_ENABLED: ${NUXT_PUBLIC_OG_CARD_ENABLED:-false}
    expose: ["7777"]
    depends_on:
      kungal-api: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(7777,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      <<: *svc-health
    restart: unless-stopped
    # Memory cap + auto-restart = OOM-recycle backstop for the upstream Nuxt
    # 4.2.2 SSR memory leak (nuxt#34071: per-request render context not freed).
    # Fresh kungal-web is ~0.3–0.9 GiB; the leak grew it to ~2.8 GiB and pegged a
    # core (GC thrash). 2g caps that: normal load fits, and once the leak fills
    # 2g the kernel OOM-kills node → restart: unless-stopped brings it back fresh.
    # Remove/raise once the upstream leak is fixed or Nuxt is upgraded.
    deploy:
      resources:
        limits:
          memory: 2g

  # ───────────────────────── schema migrations (auto on `up`) ────────────────
  # Runs on a plain `up` (kungal-api depends_on it) → pending migrations apply
  # before the API starts. The binary's default `-exclude` still holds back the
  # deferred/cross-repo migrations (005/006/007/012/015); run those manually with
  # `--only=NNN` at the right moment. See nextmoe-docs docs/shared/user-migration + 16-data-cutover.md.
  migrate:
    image: ghcr.io/kunmoe/kungal-migrate:latest
    pull_policy: always
    # The image bakes migrations at /migrations but its WORKDIR is
    # /home/nonroot, so the binary's default `-path migrations` (relative)
    # resolves to a non-existent dir → it silently finds 0 migrations and
    # exits 0 ("没有待执行的迁移"). Pin CWD to / so `-path migrations` → /migrations.
    # (Keeps manual `... run --rm migrate --only=NNN` working too, vs hard-coding
    # the command.) Proper long-term fix is the Dockerfile WORKDIR / COPY path.
    working_dir: /
    environment: { <<: *kungal-api-env }
    restart: "no"

  # ─────────────────────── one-off jobs (profile: jobs) ──────────────────────
  # All cmd/* binaries (check-dup-email / backfill-provider-names / migrate --only=…):
  #   docker compose -f docker-compose.prod.yml --profile jobs run --rm tools backfill-provider-names
  tools:
    image: ghcr.io/kunmoe/kungal-tools:latest
    pull_policy: always
    environment: { <<: *kungal-api-env }
    profiles: ["jobs"]
    restart: "no"

networks:
  default:
    name: dokploy-network
    external: true
